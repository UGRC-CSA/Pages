# CSP Sprint 2 teaching plan: who teaches what, on which day, for which period.
#
# Change this file by pull request. The calendar reads it when the site builds.
# Every key is explained in README.md next to this file. Dates come from
# _data/school_calendar.yml: week 6 is 2026-09-21 to 09-25, week 7 is
# 2026-09-28 to 10-02, and 2026-09-29 is a non-student day.

course: CSP
sprint: 2

# Bump the date and add a line each time the plan changes, so a stale plan is
# visible on the calendar.
last_updated: "2026-09-08"
changes:
  - date: "2026-09-08"
    note: "First version. Checkpoints follow the teacher's sample weeks. No lesson rows yet; tables claim them by pull request."

# FRQ types are for CSA lessons. Leave this empty and skip `frq` on a row.
frq_types: []

# The teacher's Sprint 2 topic menu for CSP on /sprint2/objectives
# (Applied Development: CSP Connection). A table claims one by adding a lesson row below and taking the
# topic off this list in the same pull request.
unclaimed_topics:
  - "Input and output: HTML input, DOM, HTML output"
  - "Code structure: arrays/lists, JSON/dictionaries, functions, classes, methods, objects, inheritance"
  - "Frontend-to-backend pipeline: presentation layer, API layer, and database layer"

periods:
  # CSP runs in bell period 3 this year (application.properties on the backend).
  "3":
    # OCS login ids of the Education Leaders for this period. Empty until the
    # teacher names them.
    leaders: []

    slots:
      # ---------------------------------------------------------------- Week 6
      - id: csp-p3-w6-mon-checkpoint
        date: "2026-09-21"
        kind: checkpoint
        topic: "Checkpoint on Lesson PRs"

      - id: csp-p3-w6-wed-checkpoint
        date: "2026-09-23"
        kind: checkpoint
        topic: "Create HW and Grading Stats"

      # ---------------------------------------------------------------- Week 7
      - id: csp-p3-w7-mon-checkpoint
        date: "2026-09-28"
        kind: checkpoint
        topic: "Checkpoint and Lesson Grades"

      - id: csp-p3-w7-mon-update
        date: "2026-09-28"
        kind: checkpoint
        topic: "Update HW and Grading Stats"

      - id: csp-p3-w7-wed-checkpoint
        date: "2026-09-30"
        kind: checkpoint
        topic: "Update HW and Grading Stats"

      - id: csp-p3-w7-fri-submit
        date: "2026-10-02"
        kind: checkpoint
        topic: "Complete and Submit HW and Grading Stats"

      # No lesson rows yet. Copy a lesson row from csa.yml to claim a day.
